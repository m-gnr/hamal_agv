# hamals_ui bridge.yaml
# Maps raw ROS topics → /ui/state JSON fields.
# Adding a new data source = adding an entry here, zero Python changes.
#
# Each entry:
#   topic:   ROS topic name
#   type:    ROS message type  (package/MsgName)
#   fields:  list of { msg_field: "...", state_key: "...", default: <value> }
#             msg_field supports dot-notation (e.g. "pose.pose.position.x")
#   offline_key:  state key set to true/false when topic is seen/missing (optional)
#   qos:          best_effort | reliable  (default: best_effort)

sources:

  # ── Odometry / Pose ────────────────────────────────────────────────────
  - topic: /odom
    type: nav_msgs/Odometry
    qos: best_effort
    offline_key: sensors.encoder
    fields:
      - { msg_field: "pose.pose.position.x",    state_key: "pose.x",       default: 0.0 }
      - { msg_field: "pose.pose.position.y",    state_key: "pose.y",       default: 0.0 }
      - { msg_field: "twist.twist.linear.x",    state_key: "pose.speed",   default: 0.0 }

  # ── IMU ────────────────────────────────────────────────────────────────
  - topic: /imu/data
    type: sensor_msgs/Imu
    qos: best_effort
    offline_key: sensors.imu
    fields:
      - { msg_field: "angular_velocity.z",      state_key: "pose.omega",   default: 0.0 }

  # ── Battery ────────────────────────────────────────────────────────────
  - topic: /battery/state
    type: sensor_msgs/BatteryState
    qos: best_effort
    fields:
      - { msg_field: "percentage",  state_key: "battery.percent",  default: 100.0 }
      - { msg_field: "voltage",     state_key: "battery.voltage",  default: 24.0  }
      - { msg_field: "current",     state_key: "battery.current",  default: 0.0   }

  # ── LiDAR health ────────────────────────────────────────────────────────
  - topic: /scan
    type: sensor_msgs/LaserScan
    qos: best_effort
    offline_key: sensors.lidar
    fields: []    # presence-only; no field extraction needed

  # ── Camera health (front) ───────────────────────────────────────────────
  - topic: /camera_front/image_raw
    type: sensor_msgs/Image
    qos: best_effort
    offline_key: sensors.cam_front
    fields: []

  # ── Camera health (back) ────────────────────────────────────────────────
  - topic: /camera_back/image_raw
    type: sensor_msgs/Image
    qos: best_effort
    offline_key: sensors.cam_back
    fields: []

  # ── Physical E-Stop / switch ────────────────────────────────────────────
  # Published by firmware via serial_bridge (topic may not exist yet)
  - topic: /estop
    type: std_msgs/Bool
    qos: reliable
    fields:
      - { msg_field: "data", state_key: "estop.active", default: false }

  - topic: /switch/mode
    type: std_msgs/String
    qos: reliable
    fields:
      - { msg_field: "data", state_key: "switch.mode", default: "auto" }

  # ── Mission / FSM ───────────────────────────────────────────────────────
  - topic: /mission/state
    type: hamals_interfaces/MissionState
    qos: reliable
    fields:
      - { msg_field: "state", state_key: "mission.state_id", default: 1 }
      - { msg_field: "phase", state_key: "mission.fsm", default: "IDLE" }
      - { msg_field: "task_id", state_key: "mission.id", default: "" }
      - { msg_field: "pickup_id", state_key: "mission.pickup", default: "" }
      - { msg_field: "dropoff_id", state_key: "mission.dropoff", default: "" }
      - { msg_field: "message", state_key: "mission.step", default: "" }
      - { msg_field: "elapsed_s", state_key: "mission.elapsed_s", default: 0.0 }

  # ── Navigation goal / feedback ──────────────────────────────────────────
  - topic: /nav/status
    type: std_msgs/String
    qos: best_effort
    fields:
      - { msg_field: "data", state_key: "_nav_json", default: "" }

  # ── QR result ───────────────────────────────────────────────────────────
  - topic: /qr/detection
    type: hamals_interfaces/QrDetection
    qos: reliable
    fields:
      - { msg_field: "payload", state_key: "qr.id", default: "" }
      - { msg_field: "detected", state_key: "qr.detected", default: false }
      - { msg_field: "x", state_key: "qr.x", default: 0.0 }
      - { msg_field: "y", state_key: "qr.y", default: 0.0 }
      - { msg_field: "z", state_key: "qr.distance_m", default: 0.0 }
      - { msg_field: "yaw_deg", state_key: "qr.angle_deg", default: 0.0 }

  # ── Line follower ────────────────────────────────────────────────────────
  - topic: /line/status
    type: std_msgs/String
    qos: best_effort
    fields:
      - { msg_field: "data", state_key: "_line_json", default: "" }

  # ── PLC bridge ───────────────────────────────────────────────────────────
  - topic: /plc/state
    type: hamals_interfaces/PlcState
    qos: reliable
    fields:
      - { msg_field: "connection_state", state_key: "plc.connection_state", default: 0 }
      - { msg_field: "active_task_id", state_key: "plc.active_task_id", default: "" }
      - { msg_field: "last_rx", state_key: "plc.last_msg", default: "" }

  # ── Safety / obstacle ────────────────────────────────────────────────────
  - topic: /safety/state
    type: hamals_interfaces/SafetyState
    qos: best_effort
    fields:
      - { msg_field: "motion_allowed", state_key: "safety.motion_allowed", default: false }
      - { msg_field: "estop_active", state_key: "safety.estop", default: false }
      - { msg_field: "obstacle_active", state_key: "safety.obstacle", default: false }
      - { msg_field: "obstacle_distance_m", state_key: "safety.obstacle_distance_m", default: -1.0 }
      - { msg_field: "reason", state_key: "safety.reason", default: "" }

  - topic: /world_model/state
    type: hamals_interfaces/WorldModelState
    qos: reliable
    fields:
      - { msg_field: "valid", state_key: "world_model.valid", default: false }
      - { msg_field: "profile", state_key: "world_model.profile", default: "" }
      - { msg_field: "config_checksum", state_key: "world_model.checksum", default: "" }
