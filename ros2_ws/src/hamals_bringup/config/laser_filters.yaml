generic_laser_filter_node:
  ros__parameters:

    filter1:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 3.5
        max_range_difference: 0.1
        max_range_check: 0

    filter2:
      name: range_filter
      type: laser_filters/LaserScanRangeFilter
      params:
        use_message_range_limits: false
        lower_threshold: 0.05
        upper_threshold: 3.5