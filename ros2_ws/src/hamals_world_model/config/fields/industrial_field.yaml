  A3: {type: pickup, approach_node: A3_APPROACH, expected_qr: q4, docking_profile: pickup_default, zone: {frame_id: map, vertices: [{x: 2.8, y: 1.1}, {x: 3.3, y: 1.1}, {x: 3.3, y: 1.7}, {x: 2.8, y: 1.7}]}, target_pose: {x: 3.05, y: 1.4, yaw_deg: 90.0}, approach_pose: {x: 3.05, y: 0.3, yaw_deg: 90.0}, exit_pose: {x: 3.05, y: 0.6, yaw_deg: 90.0}}
  B1: {type: dropoff, approach_node: B1_APPROACH, expected_qr: q9, docking_profile: dropoff_default, zone: {frame_id: map, vertices: [{x: 6.3, y: -1.6}, {x: 6.9, y: -1.6}, {x: 6.9, y: -1.1}, {x: 6.3, y: -1.1}]}, target_pose: {x: 6.6, y: -1.35, yaw_deg: 0.0}, approach_pose: {x: 5.5, y: -1.35, yaw_deg: 0.0}, exit_pose: {x: 5.8, y: -1.35, yaw_deg: 0.0}}
  B2: {type: dropoff, approach_node: B2_APPROACH, expected_qr: q8, docking_profile: dropoff_default, zone: {frame_id: map, vertices: [{x: 6.3, y: -0.3}, {x: 6.9, y: -0.3}, {x: 6.9, y: 0.3}, {x: 6.3, y: 0.3}]}, target_pose: {x: 6.6, y: 0.0, yaw_deg: 0.0}, approach_pose: {x: 5.5, y: 0.0, yaw_deg: 0.0}, exit_pose: {x: 5.8, y: 0.0, yaw_deg: 0.0}}
