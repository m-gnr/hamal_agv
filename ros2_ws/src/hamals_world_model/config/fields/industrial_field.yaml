    approach_node: B2_APPROACH
    expected_qr: BIRAK2   # yous: resmi QR metni
    docking_profile: dropoff_default
    zone:
      frame_id: map
      vertices:
        - {x: 11.0, y: 9.0}
        - {x: 12.0, y: 9.0}
        - {x: 12.0, y: 10.0}
        - {x: 11.0, y: 10.0}
    target_pose:   {x: 11.5, y: 9.5, yaw_deg: 0.0}
    approach_pose: {x: 11.5, y: 9.5, yaw_deg: 0.0}
    exit_pose:     {x: 11.5, y: 9.5, yaw_deg: 0.0}

  B3:
    type: dropoff
    approach_node: B3_APPROACH
    expected_qr: BIRAK3   # yous: resmi QR metni
    docking_profile: dropoff_default
    zone:
