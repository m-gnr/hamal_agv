      vertices:
        - {x: 11.0, y: 11.0}
        - {x: 12.0, y: 11.0}
        - {x: 12.0, y: 12.0}
        - {x: 11.0, y: 12.0}
    target_pose:   {x: 11.5, y: 11.5, yaw_deg: 0.0}
    approach_pose: {x: 11.5, y: 11.5, yaw_deg: 0.0}
    exit_pose:     {x: 11.5, y: 11.5, yaw_deg: 0.0}

qr_markers:   # yous: resmi QR metinleri (ek sartname)
  ALIM1: {station: A1}
  ALIM2: {station: A2}
  ALIM3: {station: A3}
  KAPI1: {purpose: door_outbound}
  KAPI2: {purpose: door_return}
  BIRAK3: {station: B3}
  BIRAK2: {station: B2}
  BIRAK1: {station: B1}

routes:
  nodes:
    START:      {pose: {x: 0.979,  y: 1.499,  yaw_deg: -90.0}}
    D1:         {pose: {x: 0.904,  y: 0.006,  yaw_deg: -92.9}}
    D2:         {pose: {x: 0.108,  y: -0.068, yaw_deg: -0.8}}
    D3:         {pose: {x: -0.571, y: -0.057, yaw_deg: -1.7}}
    DOOR_W:     {pose: {x: -1.177, y: -0.105, yaw_deg: -0.4}}
    DOOR_E:     {pose: {x: -1.408, y: -0.108, yaw_deg: 1.3}}
    D4:         {pose: {x: -1.719, y: -0.139, yaw_deg: 6.7}}
    D5:         {pose: {x: -2.060, y: -1.084, yaw_deg: -95.3}}
    D6:         {pose: {x: 9.5,    y: 11.5,   yaw_deg: 0.0}}
    A1_APPROACH: {pose: {x: 1.006, y: -0.339, yaw_deg: -85.9}}
    A2_APPROACH: {pose: {x: 9.5,   y: 9.5,    yaw_deg: 0.0}}
    A3_APPROACH: {pose: {x: 9.5,   y: 11.5,   yaw_deg: 0.0}}
    B1_APPROACH: {pose: {x: -2.019, y: -1.026, yaw_deg: -178.5}}
    B2_APPROACH: {pose: {x: 11.5,   y: 9.5,    yaw_deg: 0.0}}
    B3_APPROACH: {pose: {x: 11.5,   y: 11.5,   yaw_deg: 0.0}}

  edges:
    - {from: START,  to: D1,     bidirectional: true, cost: 1.0}
    - {from: D1,     to: D2,     bidirectional: true, cost: 1.0}
    - {from: D2,     to: D3,     bidirectional: true, cost: 1.0}
    - {from: D3,     to: DOOR_W, bidirectional: true, cost: 1.0}
    - {from: DOOR_W, to: DOOR_E, bidirectional: true, cost: 1.0, door_controlled: MAIN_DOOR}
    - {from: DOOR_E, to: D4,     bidirectional: true, cost: 1.0}
    - {from: D4,     to: D5,     bidirectional: true, cost: 1.0}
    - {from: D1,     to: A1_APPROACH, bidirectional: true, cost: 1.0}
    - {from: D2,     to: A2_APPROACH, bidirectional: true, cost: 1.0}
    - {from: D3,     to: A3_APPROACH, bidirectional: true, cost: 1.0}
    - {from: D5,     to: B1_APPROACH, bidirectional: true, cost: 0.1}
    - {from: D4,     to: B2_APPROACH, bidirectional: true, cost: 0.1}
    - {from: D6,     to: B3_APPROACH, bidirectional: true, cost: 0.1}
    - {from: D4,     to: D6,          bidirectional: true, cost: 1.0}
    - {from: D4,     to: A2_APPROACH, bidirectional: true, cost: 1.0}
    - {from: D4,     to: A3_APPROACH, bidirectional: true, cost: 1.0}

doors:
  MAIN_DOOR:
    controlled_edge: DOOR_W_TO_DOOR_E
    plc_id: door_1
    west_node: DOOR_W
    east_node: DOOR_E
    request_pose:
      outbound: {x: -1.177, y: -0.105, yaw_deg: -0.4}
      return:   {x: -1.408, y: -0.108, yaw_deg: 180.0}
