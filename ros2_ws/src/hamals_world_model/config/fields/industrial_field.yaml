schema_version: 1
frame_id: map
map: package://hamals_slam/maps/map.yaml

stations:
  A1:
    type: pickup
    approach_node: A1_APPROACH
    expected_qr: ALIM1   # yous: resmi QR metni
    docking_profile: pickup_default
    zone:
      frame_id: map
      vertices:
        - {x: 0.5, y: -0.2}
        - {x: 1.3, y: -0.2}
        - {x: 1.3, y: -1.9}
        - {x: 0.5, y: -1.9}
    target_pose:   {x: 0.886, y: -1.566, yaw_deg: -91.8}
    approach_pose: {x: 1.006, y: -0.339, yaw_deg: -85.9}
    exit_pose:     {x: 1.006, y: -0.339, yaw_deg: 94.1}

  A2:
    type: pickup
    approach_node: A2_APPROACH
    expected_qr: ALIM2   # yous: resmi QR metni
    docking_profile: pickup_default
    zone:
      frame_id: map
      vertices:
        - {x: 9.0, y: 9.0}
        - {x: 10.0, y: 9.0}
        - {x: 10.0, y: 10.0}
        - {x: 9.0, y: 10.0}
