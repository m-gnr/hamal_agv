/**:
  ros__parameters:
    use_sim_time: false

# ------------------------------------------------------------
# Map Server
# ------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/hamal/Desktop/hamal_agv/ros2_ws/src/hamals_slam/maps/map.yaml"

# ------------------------------------------------------------
# AMCL
# ------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: false

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan

    tf_broadcast: true

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.05
    update_min_a: 0.05

    resample_interval: 1
    transform_tolerance: 1.0

# ------------------------------------------------------------
# BT Navigator
# ------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20

# ------------------------------------------------------------
# Eski BT node parametreleri
# ------------------------------------------------------------
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ------------------------------------------------------------
# Planner Server
#
# Hybrid-A* + REEDS_SHEPP
# İleri ve geri hareket desteklenir.
# ------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      allow_unknown: true

      downsample_costmap: false
      downsampling_factor: 1

      tolerance: 0.20

      max_iterations: 1000000
      max_planning_time: 3.0

      motion_model_for_search: "REEDS_SHEPP"

      angle_quantization_bins: 72

      minimum_turning_radius: 0.40

      reverse_penalty: 0.0

      change_penalty: 2.0

      non_straight_penalty: 1.20

      cost_penalty: 2.0

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      smooth_path: true

# ------------------------------------------------------------
# Controller Server
# RPP
#
# Hızlar yumuşatılmış:
# - düşük hız
# - düşük acceleration
# - kontrollü deceleration
# ------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false

    transform_tolerance: 0.5

    controller_frequency: 20.0

    odom_topic: /odom

    controller_plugins: ["FollowPath"]

    goal_checker_plugins: ["general_goal_checker"]

    progress_checker_plugins: ["progress_checker"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # ------------------------------------------------------
      # السرعة الأساسية
      # ------------------------------------------------------

      desired_linear_vel: 0.15

      # ------------------------------------------------------
      # تسارع / تباطؤ ناعم
      # ------------------------------------------------------

      max_linear_accel: 0.15
      max_linear_decel: 0.20

      # ------------------------------------------------------
      # Rotation
      # ------------------------------------------------------

      use_rotate_to_heading: false

      allow_reversing: true

      rotate_to_heading_angular_vel: 0.25

      max_angular_accel: 0.30

      # ------------------------------------------------------
      # Goal
      # ------------------------------------------------------

      goal_dist_tol: 0.10

      # ------------------------------------------------------
      # Lookahead
      # ------------------------------------------------------

      lookahead_dist: 0.60

      min_lookahead_dist: 0.40

      max_lookahead_dist: 0.80

      use_velocity_scaled_lookahead_dist: true

      # ------------------------------------------------------
      # Collision
      # ------------------------------------------------------

      use_collision_detection: true

    # --------------------------------------------------------
    # Goal checker
    # --------------------------------------------------------
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"

      xy_goal_tolerance: 0.10

      yaw_goal_tolerance: 0.10

      stateful: true

    # --------------------------------------------------------
    # Progress checker
    # --------------------------------------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      required_movement_radius: 0.10

      movement_time_allowance: 60.0

# ------------------------------------------------------------
# Behavior Server
# ------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: map

    robot_base_frame: base_footprint

    costmap_topic: local_costmap/costmap_raw

    footprint_topic: local_costmap/published_footprint

    behavior_plugins:
      - "spin"
      - "backup"
      - "wait"

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"

# ------------------------------------------------------------
# Waypoint Follower
# ------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: false

    loop_rate: 20

    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"

      enabled: true

      waypoint_pause_duration: 0

# ------------------------------------------------------------
# Velocity Smoother
# ------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: "OPEN_LOOP"

    # --------------------------------------------------------
    # Maximum velocities
    # --------------------------------------------------------

    max_velocity: [0.20, 0.0, 0.35]

    min_velocity: [-0.20, 0.0, -0.35]

    # --------------------------------------------------------
    # Acceleration
    # --------------------------------------------------------

    max_accel: [0.15, 0.0, 0.30]

    # --------------------------------------------------------
    # Deceleration
    # --------------------------------------------------------

    max_decel: [-0.20, 0.0, -0.30]

    # --------------------------------------------------------
    # Odom
    # --------------------------------------------------------

    odom_topic: /odom

    odom_duration: 0.1

    # --------------------------------------------------------
    # Deadband
    # --------------------------------------------------------

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0

# ------------------------------------------------------------
# Smoother Server
# ------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: false

    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10

      max_its: 1000

      do_refinement: true

# ------------------------------------------------------------
# Global Costmap
# ------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map

      robot_base_frame: base_footprint

      update_frequency: 5.0

      publish_frequency: 2.0

      resolution: 0.05

      track_unknown_space: true

      # Robot footprint
      # Length approximately 1.14 m
      # Width approximately 0.53 m
      footprint: "[[0.70, 0.265], [0.70, -0.265], [-0.44, -0.265], [-0.44, 0.265]]"

      footprint_padding: 0.05

      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      # ------------------------------------------------------
      # Static layer
      # ------------------------------------------------------
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        enabled: true

      # ------------------------------------------------------
      # Obstacle layer
      # ------------------------------------------------------
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: "scan"

        scan:
          topic: /scan

          data_type: "LaserScan"

          marking: true

          clearing: true

          max_obstacle_height: 0.50

          obstacle_max_range: 2.5

          raytrace_max_range: 4.0

      # ------------------------------------------------------
      # Inflation layer
      # ------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.20

        cost_scaling_factor: 5.0

# ------------------------------------------------------------
# Local Costmap
# ------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom

      robot_base_frame: base_footprint

      rolling_window: true

      width: 5

      height: 5

      resolution: 0.05

      update_frequency: 10.0

      publish_frequency: 5.0

      # Robot footprint
      footprint: "[[0.70, 0.265], [0.70, -0.265], [-0.44, -0.265], [-0.44, 0.265]]"

      footprint_padding: 0.05

      plugins:
        - "obstacle_layer"
        - "inflation_layer"

      # ------------------------------------------------------
      # Obstacle layer
      # ------------------------------------------------------
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: "scan"

        scan:
          topic: /scan

          data_type: "LaserScan"

          marking: true

          clearing: true

          max_obstacle_height: 0.50

          obstacle_range: 2.5

          raytrace_range: 4.0

      # ------------------------------------------------------
      # Inflation layer
      # ------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.1

        cost_scaling_factor: 3.0

# ------------------------------------------------------------
# Lifecycle Manager - Localization
# ------------------------------------------------------------
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false

    autostart: true

    node_names:
      - map_server
      - amcl

# ------------------------------------------------------------
# Lifecycle Manager - Navigation
# ------------------------------------------------------------
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false

    autostart: true

    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother