# ============================================================
# hamals_robot — Forklift AGV Robot Konfigürasyonu
# v8 — ölçülen yeni robot mekanik değerlerine göre güncellendi
# ============================================================
#
# Koordinat sistemi:
#   +x  : ileri  (fork yönü)
#   +y  : sol
#   +z  : yukarı
#
# Mekanik bilgiler:
#   Gövde uzunluğu                         : 52.6 cm  = 0.526 m
#   Gövde genişliği tekersiz               : 40.0 cm  = 0.400 m
#   Gövde genişliği tekerli                : 55.0 cm  = 0.550 m
#   Gövde yüksekliği tekersiz              : 33.7 cm  = 0.337 m
#   Gövde yüksekliği tekerli               : 38.2 cm  = 0.382 m
#   Robotun yerden yüksekliği              : 4.5 cm   = 0.045 m
#   Sürüş teker çapı                       : 20.0 cm  = 0.200 m
#   Sürüş teker yarıçapı                   : 10.0 cm  = 0.100 m
#   Sağ-sol teker merkezleri arası         : 46.2 cm  = 0.462 m
#   Teker genişliği                        : 5.0 cm   = 0.050 m
#   Destek teker çapı                      : 3.0 cm   = 0.030 m
#   Destek teker yarıçapı                  : 1.5 cm   = 0.015 m
#   Destek teker merkezi arka kenardan     : 11.0 cm  = 0.110 m
#   Forklar dahil toplam robot uzunluğu    : 112.6 cm = 1.126 m
#   Forklar hariç toplam robot uzunluğu    : 52.6 cm  = 0.526 m
#   Fork genişliği                         : 35.5 cm  = 0.355 m
#   Fork uzunluğu                          : 51.0 cm  = 0.510 m
#   Fork yüksekliği                        : 1.0 cm   = 0.010 m
#   İki fork arası açıklık                 : 23.0 cm  = 0.230 m
#   Lidar alt yüzey yüksekliği             : 38.0 cm  = 0.380 m
#
# Ölçülen x konumları:
#   Gövde merkezi arka uçtan               : 26.3 cm  = 0.263 m
#   Sürüş teker merkezi arka uçtan         : 42.5 cm  = 0.425 m
#   Sürüş teker x                          : 42.5 - 26.3 = +16.2 cm = +0.162 m
#   Mast merkezi arka uçtan                : 55.0 cm  = 0.550 m
#   Mast x                                 : 55.0 - 26.3 = +28.7 cm = +0.287 m
#   Lidar merkezi gövde merkezine göre     : +16.25 cm = +0.1625 m
#
# Önemli z referansları:
#   z = 0.0000 : zemin / base_footprint
#   z = 0.0450 : gövde alt yüzeyi
#   z = 0.1000 : sürüş teker merkezi
#   z = 0.2135 : base_link / gövde geometrik merkezi
#   z = 0.3820 : gövde üst yüzeyi
#   z = 0.3800 : lidar alt yüzeyi
#   z = 0.4000 : lidar geometrik merkezi / lidar_link
#
# Zemin ve hizalama doğrulama:
#   gövde altı       : 0.2135 - 0.1685 = 0.0450 ✓
#   gövde üstü       : 0.2135 + 0.1685 = 0.3820 ✓
#   drive wheel altı : 0.1000 - 0.1000 = 0.0000 ✓
#   wheel relative z : 0.1000 - 0.2135 = -0.1135 ✓
#   caster altı      : 0.0150 - 0.0150 = 0.0000 ✓
#   caster rel z     : 0.0150 - 0.2135 = -0.1985 ✓
#   lidar merkezi z  : 0.3800 + 0.040 / 2 = 0.4000 ✓
# ============================================================

robot:
  name: "hamals_robot"
  type: "forklift_agv"

  frames:
    base_footprint: "base_footprint"
    base_link: "base_link"
    forklift_mast_link: "forklift_mast_link"
    fork_carriage_link: "fork_carriage_link"
    left_fork_link: "left_fork_link"
    right_fork_link: "right_fork_link"
    left_drive_wheel_link: "left_drive_wheel_link"
    right_drive_wheel_link: "right_drive_wheel_link"
    rear_center_caster_link: "rear_center_caster_link"
    lidar_mount_link: "lidar_mount_link"
    lidar_link: "lidar_link"

units:
  length: "meter"
  angle: "radian"

# ============================================================
# TABAN
# ============================================================

base:
  length: 0.526
  width: 0.400
  height: 0.337

  # base_link gövdenin geometrik merkezidir.
  #
  # Gövde altı: 0.045 m
  # Gövde yüksekliği: 0.337 m
  # base_link z = 0.045 + 0.337 / 2 = 0.2135 m
  # Gövde üstü = 0.2135 + 0.337 / 2 = 0.382 m
  origin:
    xyz: [0.0, 0.0, 0.2135]
    rpy: [0.0, 0.0, 0.0]

  collision:
    length: 0.526
    width: 0.400
    height: 0.337

# ============================================================
# SÜRÜŞ TEKERLEKLERİ
# ============================================================

wheels:
  left_drive:
    enabled: true
    type: "drive_wheel"

    radius: 0.100
    width: 0.050

    # Sağ-sol teker merkezleri arası = 0.462 m
    # Sol teker y = +0.462 / 2 = +0.231 m
    #
    # Sürüş teker merkezi arka uçtan = 0.425 m
    # Gövde merkezi arka uçtan = 0.263 m
    # x = 0.425 - 0.263 = 0.162 m
    #
    # Dünya z merkezi = 0.100 m
    # base_link z      = 0.2135 m
    # relative z       = 0.100 - 0.2135 = -0.1135 m
    origin:
      xyz: [0.162, 0.231, -0.1135]
      rpy: [1.5708, 0.0, 0.0]

    joint:
      name: "left_drive_wheel_joint"
      type: "continuous"
      parent: "base_link"
      child: "left_drive_wheel_link"
      axis: [0.0, 0.0, 1.0]

  right_drive:
    enabled: true
    type: "drive_wheel"

    radius: 0.100
    width: 0.050

    # Sağ teker y = -0.462 / 2 = -0.231 m
    origin:
      xyz: [0.162, -0.231, -0.1135]
      rpy: [1.5708, 0.0, 0.0]

    joint:
      name: "right_drive_wheel_joint"
      type: "continuous"
      parent: "base_link"
      child: "right_drive_wheel_link"
      axis: [0.0, 0.0, 1.0]

# ============================================================
# CASTER / ARKA DENGE TEKERİ
# ============================================================

caster:
  rear_center:
    enabled: true
    type: "fixed_caster"

    radius: 0.015

    # Destek teker çapı = 0.030 m
    # Destek teker yarıçapı = 0.015 m
    #
    # Dünya z merkezi = 0.015 m
    # base_link z      = 0.2135 m
    # relative z       = 0.015 - 0.2135 = -0.1985 m
    #
    # Robot gövde uzunluğu = 0.526 m
    # Robot arka kenarı = -0.526 / 2 = -0.263 m
    # Destek teker merkezi arka kenardan 0.110 m önde:
    # x = -0.263 + 0.110 = -0.153 m
    origin:
      xyz: [-0.153, 0.0, -0.1985]
      rpy: [0.0, 0.0, 0.0]

    joint:
      name: "rear_center_caster_joint"
      type: "fixed"
      parent: "base_link"
      child: "rear_center_caster_link"

# ============================================================
# FORKLIFT MEKANİZMASI
# ============================================================

forklift:
  mast:
    enabled: true

    # Gövde yüksekliği = 0.337 m
    # Mast yüksekliği geçici olarak gövde yüksekliğiyle aynı tutuldu.
    height: 0.337
    width: 0.355
    depth: 0.050

    # Mast merkezi arka uçtan = 0.550 m
    # Gövde merkezi arka uçtan = 0.263 m
    # x = 0.550 - 0.263 = 0.287 m
    origin:
      xyz: [0.287, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]

    joint:
      name: "forklift_mast_joint"
      type: "fixed"
      parent: "base_link"
      child: "forklift_mast_link"

    columns:
      left:
        width: 0.060
        depth: 0.050
        height: 0.337
        origin:
          xyz: [0.0, 0.14625, 0.0]
          rpy: [0.0, 0.0, 0.0]

      right:
        width: 0.060
        depth: 0.050
        height: 0.337
        origin:
          xyz: [0.0, -0.14625, 0.0]
          rpy: [0.0, 0.0, 0.0]

  carriage:
    enabled: true

    width: 0.355
    depth: 0.040
    height: 0.120

    # Fork alt kısmı gövde alt tabanına yakın başlatıldı.
    #
    # base_link dünya z        = 0.2135
    # fork alt hedef z         = 0.045
    # fork yüksekliği          = 0.010
    # fork merkez hedef z      = 0.045 + 0.010 / 2 = 0.050
    #
    # left/right fork origin z = -0.065 olduğundan:
    # carriage dünya z = 0.050 - (-0.065) = 0.115
    # carriage rel z   = 0.115 - 0.2135 = -0.0985
    origin:
      xyz: [0.03, 0.0, -0.0985]
      rpy: [0.0, 0.0, 0.0]

    joint:
      name: "forklift_lift_joint"
      type: "prismatic"
      parent: "forklift_mast_link"
      child: "fork_carriage_link"
      axis: [0.0, 0.0, 1.0]

      limit:
        lower: 0.00
        upper: 0.20
        effort: 100.0
        velocity: 0.15

  forks:
    enabled: true

    # Fork uzunluğu = 0.510 m
    # Fork toplam dış genişlik = 0.355 m
    # İki fork arası açıklık = 0.230 m
    #
    # Tek fork genişliği:
    #   (0.355 - 0.230) / 2 = 0.0625 m
    #
    # Fork merkez y offset:
    #   0.230 / 2 + 0.0625 / 2 = 0.14625 m
    length: 0.510
    width: 0.0625
    height: 0.010

    left:
      origin:
        xyz: [0.255, 0.14625, -0.065]
        rpy: [0.0, 0.0, 0.0]

      joint:
        name: "left_fork_joint"
        type: "fixed"
        parent: "fork_carriage_link"
        child: "left_fork_link"

    right:
      origin:
        xyz: [0.255, -0.14625, -0.065]
        rpy: [0.0, 0.0, 0.0]

      joint:
        name: "right_fork_joint"
        type: "fixed"
        parent: "fork_carriage_link"
        child: "right_fork_link"

# ============================================================
# LIDAR
# ============================================================

lidar_mount:
  enabled: true

  radius: 0.060
  height: 0.040

  # Lidar için verilen 38 cm yükseklik alt yüzeydir.
  # Lidar alt yüzeyi dünya z = 0.380 m
  # Lidar yüksekliği = 0.040 m
  # Lidar merkezi / lidar_link hedef z = 0.380 + 0.040 / 2 = 0.400 m
  #
  # base_link z = 0.2135 m
  # lidar_link hedef relative z = 0.400 - 0.2135 = 0.1865 m
  #
  # lidar origin z = 0.040 olduğundan:
  # mount relative z = 0.1865 - 0.040 = 0.1465 m
  #
  # Lidar merkezi robot gövde merkezine göre 16.25 cm önde:
  # x = +0.1625 m
  origin:
    xyz: [0.1625, 0.0, 0.1465]
    rpy: [0.0, 0.0, 0.0]

  joint:
    name: "lidar_mount_joint"
    type: "fixed"
    parent: "base_link"
    child: "lidar_mount_link"

lidar:
  enabled: true
  type: "cylindrical_2d_lidar"

  radius: 0.045
  height: 0.040

  # lidar_link dünya z:
  # base_link z + lidar_mount z + lidar origin z
  # 0.2135 + 0.1465 + 0.040 = 0.400 m
  #
  # Lidar alt yüzeyi:
  # 0.400 - 0.040 / 2 = 0.380 m
  origin:
    xyz: [0.0, 0.0, 0.040]
    rpy: [0.0, 0.0, 0.0]

  joint:
    name: "lidar_joint"
    type: "fixed"
    parent: "lidar_mount_link"
    child: "lidar_link"

  ros:
    topic: "/scan"
    frame_id: "lidar_link"

# ============================================================
# GÖRSEL MATERYALLER
# ============================================================

materials:
  base: { name: "base_light_gray", color: [0.75, 0.75, 0.75, 1.0] }
  forklift_mast: { name: "mast_dark_gray", color: [0.25, 0.25, 0.25, 1.0] }
  fork_carriage: { name: "carriage_gray", color: [0.35, 0.35, 0.35, 1.0] }
  forks: { name: "fork_dark_gray", color: [0.30, 0.30, 0.30, 1.0] }
  wheels: { name: "wheel_black", color: [0.02, 0.02, 0.02, 1.0] }
  caster: { name: "caster_black", color: [0.02, 0.02, 0.02, 1.0] }
  lidar_mount: { name: "lidar_mount_gray", color: [0.20, 0.20, 0.20, 1.0] }
  lidar: { name: "lidar_blue", color: [0.00, 0.20, 0.80, 1.0] }

# ============================================================
# FİZİK
# ============================================================

physics:
  default_friction:
    mu1: 1.0
    mu2: 1.0

  default_contact:
    kp: 100000.0
    kd: 10.0

# ============================================================
# ATALET TENSÖRLERİ
# ============================================================

inertial:
  base:
    mass: 18.0
    ixx: 0.35
    ixy: 0.0
    ixz: 0.0
    iyy: 0.80
    iyz: 0.0
    izz: 0.95

  forklift_mast:
    mass: 2.0
    ixx: 0.05
    ixy: 0.0
    ixz: 0.0
    iyy: 0.05
    iyz: 0.0
    izz: 0.02

  fork_carriage:
    mass: 1.5
    ixx: 0.02
    ixy: 0.0
    ixz: 0.0
    iyy: 0.03
    iyz: 0.0
    izz: 0.04

  fork:
    mass: 0.8
    ixx: 0.01
    ixy: 0.0
    ixz: 0.0
    iyy: 0.03
    iyz: 0.0
    izz: 0.03

  wheel:
    mass: 0.7
    ixx: 0.002
    ixy: 0.0
    ixz: 0.0
    iyy: 0.002
    iyz: 0.0
    izz: 0.001

  caster:
    mass: 0.3
    ixx: 0.001
    ixy: 0.0
    ixz: 0.0
    iyy: 0.001
    iyz: 0.0
    izz: 0.001

  lidar_mount:
    mass: 0.2
    ixx: 0.0005
    ixy: 0.0
    ixz: 0.0
    iyy: 0.0005
    iyz: 0.0
    izz: 0.0005

  lidar:
    mass: 0.25
    ixx: 0.0008
    ixy: 0.0
    ixz: 0.0
    iyy: 0.0008
    iyz: 0.0
    izz: 0.0008

# ============================================================
# GAZEBO
# ============================================================

gazebo:
  enabled: true

  materials:
    base: "Gazebo/Grey"
    forklift_mast: "Gazebo/DarkGrey"
    fork_carriage: "Gazebo/Grey"
    forks: "Gazebo/DarkGrey"
    wheels: "Gazebo/Black"
    caster: "Gazebo/Black"
    lidar_mount: "Gazebo/DarkGrey"
    lidar: "Gazebo/Blue"

  wheels:
    friction:
      mu1: 1.2
      mu2: 1.2

  caster:
    friction:
      mu1: 0.4
      mu2: 0.4

  lidar:
    enabled: true
    topic: "/scan"
    frame_name: "lidar_link"
    update_rate: 10.0

    scan:
      samples: 720
      resolution: 1
      min_angle: -3.14159
      max_angle: 3.14159

    range:
      min: 0.12
      max: 12.0
      resolution: 0.01

    noise:
      type: "gaussian"
      mean: 0.0
      stddev: 0.01

# ============================================================
# ROS 2 CONTROL
# ============================================================

ros2_control:
  enabled: true

  hardware:
    name: "GazeboSystem"
    plugin: "gz_ros2_control/GazeboSimSystem"

  joints:
    left_drive_wheel_joint:
      command_interfaces: ["velocity"]
      state_interfaces: ["position", "velocity"]

    right_drive_wheel_joint:
      command_interfaces: ["velocity"]
      state_interfaces: ["position", "velocity"]

    forklift_lift_joint:
      command_interfaces: ["position"]
      state_interfaces: ["position", "velocity"]

# ============================================================
# KONTROLCÜLER
# ============================================================

controllers:
  diff_drive:
    enabled: true
    name: "diff_drive_controller"

    left_wheel_names: ["left_drive_wheel_joint"]
    right_wheel_names: ["right_drive_wheel_joint"]

    # Yeni robot mekanik değerleri:
    # Sağ-sol teker merkezleri arası = 0.462 m
    # Sürüş teker yarıçapı = 0.100 m
    wheel_separation: 0.462
    wheel_radius: 0.100

    cmd_vel_topic: "/cmd_vel"
    odom_topic: "/odom"

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

  forklift_lift:
    enabled: true
    name: "forklift_lift_controller"

    joint: "forklift_lift_joint"
    command_interface: "position"

    min_position: 0.00
    max_position: 0.20